<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Outer Border -->
  <rect x="2" y="2" width="1196" height="336" rx="14" fill="none" stroke="url(#border-glow)" stroke-width="2"/>

  <!-- Left Accent Glow -->
  <circle cx="160" cy="170" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1060" cy="170" r="140" fill="#3b82f6" opacity="0.06" filter="url(#glow)"/>

  <!-- Visual Icon / Logo Container (Left) -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Outer Container -->
    <rect x="0" y="0" width="220" height="220" rx="24" fill="#0c1424" stroke="#1e293b" stroke-width="2"/>
    <rect x="10" y="10" width="200" height="200" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Rotating Segments / Time Slice Indicator -->
    <path d="M 110 35 A 75 75 0 0 1 185 110" fill="none" stroke="url(#cyan-glow)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 185 110 A 75 75 0 0 1 110 185" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M 110 185 A 75 75 0 0 1 35 110" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <path d="M 35 110 A 75 75 0 0 1 110 35" fill="none" stroke="url(#amber-glow)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

    <!-- Arrow head on active arc -->
    <polygon points="185,100 195,115 178,118" fill="#06b6d4"/>

    <!-- Center Core -->
    <rect x="80" y="80" width="60" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="110" cy="110" r="14" fill="url(#cyan-glow)"/>
    <circle cx="110" cy="110" r="6" fill="#ffffff"/>

    <!-- Tray Indicator Light -->
    <circle cx="185" cy="40" r="7" fill="#10b981" filter="url(#glow)"/>
    <circle cx="185" cy="40" r="3" fill="#ffffff"/>
  </g>

  <!-- Typography & Text Content (Right) -->
  <g transform="translate(320, 60)">
    <!-- Badges Row -->
    <g transform="translate(0, 8)">
      <rect x="0" y="0" width="94" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="47" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">DEV-BRICKS</text>

      <rect x="104" y="0" width="112" height="24" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
      <text x="160" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">WINDOWS TRAY</text>

      <rect x="226" y="0" width="102" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="277" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">LOCAL-FIRST</text>

      <rect x="338" y="0" width="100" height="24" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="388" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">FAIL-CLOSED</text>

      <rect x="448" y="0" width="80" height="24" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="488" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">MIT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">app-rotator</text>

    <!-- Subtitle -->
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#38bdf8">Windows Desktop Application Time-Slicing &amp; Resource Rotator</text>

    <!-- Detailed Tagline / Description -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      <tspan x="0" dy="0">Time-slices local heavy AI desktop applications (Codex Desktop, Claude Desktop, Antigravity IDE)</tspan>
      <tspan x="0" dy="22">to eliminate VRAM starvation, GPU contention, and uncontrolled background runaway execution.</tspan>
    </text>

    <!-- Feature Highlights / Specs -->
    <g transform="translate(0, 185)">
      <circle cx="6" cy="6" r="4" fill="#06b6d4"/>
      <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Configurable Cycle Windows</text>

      <circle cx="210" cy="6" r="4" fill="#3b82f6"/>
      <text x="222" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Safe Process Scoping</text>

      <circle cx="390" cy="6" r="4" fill="#34d399"/>
      <text x="402" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Zero-Egress Privacy</text>

      <circle cx="560" cy="6" r="4" fill="#a78bfa"/>
      <text x="572" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">PySide6 Native Tray</text>
    </g>
  </g>
</svg>